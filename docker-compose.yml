services:
  api:
    build: .
    ports:
      - "8080:8080"
    environment:
      DAY1_SALT: ${DAY1_SALT}
      PORT: "8080"
      DATABASE_URL: postgres://nascon:nascon@db:5432/nascon
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-nascon-dev-jwt-secret}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: nasconminio
      MINIO_SECRET_KEY: nasconminio
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "src/worker.js"]
    environment:
      DAY1_SALT: ${DAY1_SALT}
      DATABASE_URL: postgres://nascon:nascon@db:5432/nascon
      REDIS_URL: redis://redis:6379
      NODE_ENV: production
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nascon
      POSTGRES_PASSWORD: nascon
      POSTGRES_DB: nascon
    command: ["postgres", "-c", "max_connections=200"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nascon -d nascon"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio:
    image: minio/minio:RELEASE.2024-09-13T20-26-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: nasconminio
      MINIO_ROOT_PASSWORD: nasconminio
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
