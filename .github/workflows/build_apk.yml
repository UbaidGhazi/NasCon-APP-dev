name: Build SportsPlus Flutter APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Doctor
        run: flutter doctor -v

      - name: Install Dependencies
        working-directory: ./mobile
        run: flutter pub get

      - name: Build APK Release
        working-directory: ./mobile
        run: flutter build apk --release --no-tree-shake-icons

      - name: Copy APK to release folder
        run: |
          mkdir -p mobile/release
          cp mobile/build/app/outputs/flutter-apk/app-release.apk mobile/release/app-release.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SportsPlus-Release-APK
          path: mobile/release/app-release.apk
          retention-days: 30
